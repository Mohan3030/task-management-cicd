
server {
    listen 80;
    server_name mytaskman.duckdns.org;

    server_tokens off;

    # Keep HTTP available for Let's Encrypt renewal
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name mytaskman.duckdns.org;

    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/mytaskman.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mytaskman.duckdns.org/privkey.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    root /usr/share/nginx/html;
    index index.html;

    # Block access to hidden files and directories,
    # except the Let's Encrypt well-known directory
    location ~ /\.(?!well-known(?:/|$)) {
        deny all;
    }

    # Serve the React application
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Forward API requests to the backend
    location /api/ {
        proxy_pass http://backend:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
